name: Deploy Web office to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-production"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site for office.junhyuk.site at URL root
        run: npm run build -- --base=/
      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium
      - name: Verify live Python console
        run: npx playwright test --config=playwright.ci.config.mjs
      - name: Upload compiled site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Allow uploaded artifacts to become available
        run: sleep 20
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
